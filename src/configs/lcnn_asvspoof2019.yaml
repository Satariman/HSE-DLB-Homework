defaults:
  - model: lcnn
  - writer: wandb
  - metrics: lcnn_asvspoof2019
  - datasets: asvspoof2019_la
  - dataloader: lcnn_asvspoof2019
  - transforms: lcnn_asvspoof2019
  - _self_
optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4
  betas: [0.9, 0.999]
  eps: 1e-8
lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.5
  step_size: 10
loss_function:
  _target_: src.loss.ExampleLoss
  class_weights: [4.9186047, 0.5565789]
trainer:
  log_step: 50
  n_epochs: 100
  epoch_len: null
  device_tensors: ["data_object", "labels"] # which tensors should be on device (ex. GPU)
  non_blocking: True # use asynchronous host-to-device copies with pinned memory
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: cuda # device name or "auto"
  override: False # if True, will override the previous run with the same name
  monitor: "min eval_EER"
  save_period: 5 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 1
